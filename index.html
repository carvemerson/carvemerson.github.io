    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"

    />
    <title>Emerson Carvalho — Software Engineer</title>
    <link rel="canonical" href="https://carvemerson.com/" />

    <!-- Open Graph (WhatsApp, LinkedIn, iMessage, Slack, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Emerson Carvalho" />
    <meta property="og:title" content="Emerson Carvalho — Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer with 8+ years building Laravel & Vue products. MSc in Computer Science (UFRN), with a competitive-programming and multi-objective-optimization background."
    />
    <meta property="og:url" content="https://carvemerson.com/" />
    <meta property="og:image" content="https://carvemerson.com/images/og-card.jpg" />
    <meta property="og:image:secure_url" content="https://carvemerson.com/images/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Emerson Carvalho — Software, engineered with precision." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X large-image card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emerson Carvalho — Software Engineer" />

      name="twitter:description"
      content="Software engineer with 8+ years building Laravel & Vue products. MSc in Computer Science (UFRN)."
    />
    <meta name="twitter:image" content="https://carvemerson.com/images/og-card.jpg" />
    <meta name="twitter:image:alt" content="Emerson Carvalho — Software, engineered with precision." />

    <!-- Theme bootstrap: set the stock before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('folio-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored || (prefersLight ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
